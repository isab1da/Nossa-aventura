<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Aventura do Eder & Isabela</title>
    <style>
        body { background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        
        #game-screen {
            width: 800px;
            height: 450px;
            position: relative;
            background-color: #000;
            overflow: hidden;
            border: 4px solid #fff;
            image-rendering: pixelated;
        }

        #background { width: 100%; height: 100%; position: absolute; background-size: cover; }
        
        .sprite { position: absolute; bottom: 50px; height: 100px; z-index: 10; transition: all 0.2s; }
        #player { left: 50px; }
        #npc { right: 100px; display: none; } /* Isabela, Feia ou Neymar */
        #taverna-obj { position: absolute; right: 50px; bottom: 40px; width: 300px; display: none; }

        /* Interface de Diálogo e Escolhas */
        #ui-box {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px;
            border: 2px solid #fff;
            font-family: 'Courier New', monospace;
            z-index: 100;
            display: none;
        }

        .btn-opcao {
            display: block;
            width: 100%;
            background: #333;
            color: white;
            border: 1px solid white;
            padding: 8px;
            margin-top: 5px;
            cursor: pointer;
            text-align: left;
        }
        .btn-opcao:hover { background: #555; }
    </style>
</head>
<body>

<div id="game-screen">
    <div id="background"></div>
    <img id="taverna-obj" src="Taverna.PNG">
    <img id="player" src="Ele_frente.PNG" class="sprite">
    <img id="npc" src="" class="sprite">

    <div id="ui-box">
        <div id="texto-narracao"></div>
        <div id="container-opcoes"></div>
    </div>
</div>

<script>
    const player = document.getElementById('player');
    const npc = document.getElementById('npc');
    const bg = document.getElementById('background');
    const ui = document.getElementById('ui-box');
    const txt = document.getElementById('texto-narracao');
    const opt = document.getElementById('container-opcoes');
    const tavernaImg = document.getElementById('taverna-obj');

    let faseAtual = "quarto";

    // 1. INÍCIO: O QUARTO
    function iniciarJogo() {
        bg.style.backgroundImage = "url('Quarto.PNG')";
        exibirDialogo("Eder acorda em um mundo estranho... Ele precisa encontrar Isabela!", [
            { texto: "Sair do quarto", acao: irParaEstrada }
        ]);
    }

    // 2. A ESTRADA (Obstáculos e Feia.PNG)
    function irParaEstrada() {
        faseAtual = "estrada";
        ui.style.display = "none";
        bg.style.backgroundImage = "url('Cenario_Estrada.PNG')";
        player.src = "Ele_direita.PNG";
        
        // Simula o encontro com a Feia.PNG após um tempo andando
        setTimeout(() => {
            npc.src = "Feia.PNG";
            npc.style.display = "block";
            exibirDialogo("Uma criatura estranha bloqueia o caminho! (Feia.PNG)", [
                { texto: "Desviar e continuar", acao: chegarNaTaverna }
            ]);
        }, 2000);
    }

    // 3. A TAVERNA
    function chegarNaTaverna() {
        npc.style.display = "none";
        tavernaImg.style.display = "block";
        player.src = "Ele_frente.PNG";

        exibirDialogo("Você está com sede e encontra a Taverna Nova Opção no caminho. O que fazer?", [
            { texto: "A) Só umazinha pra matar a sede 🍻", acao: resultadoA },
            { texto: "B) Passo longe! Prefiro encontrar o amor da minha vida ♥️", acao: resultadoB },
            { texto: "C) Comprar um docinho para a Isabela 🍫", acao: resultadoC }
        ]);
    }

    // LÓGICA DAS ESCOLHAS
    function resultadoA() {
        exibirDialogo("GAME OVER! Você me odeia?? 🤨", [
            { texto: "Voltar ao Checkpoint", acao: () => location.reload() }
        ]);
    }

    function resultadoB() {
        tavernaImg.style.display = "none";
        exibirDialogo("Você ignora a sede e foca no seu amor. Mas quem é aquele ali na frente?", [
            { texto: "Continuar andando", acao: encontrarNeymar }
        ]);
    }

    function resultadoC() {
        tavernaImg.style.display = "none";
        txt.innerHTML = "Você realmente conhece sua amada! O cheiro do doce atrai Isabela...";
        opt.innerHTML = "";
        
        // Isabela aparece andando
        npc.src = "Ela_andando_esquerda.PNG";
        npc.style.display = "block";
        npc.style.right = "800px"; // Começa fora
        
        setTimeout(() => {
            npc.style.transition = "right 3s linear";
            npc.style.right = "200px"; // Isabela chega perto do Eder
            
            setTimeout(() => {
                npc.src = "Ela_esquerda.PNG";
                finalC();
            }, 3200);
        }, 500);
    }

    function finalC() {
        exibirDialogo("Isabela: Amor! Nem acredito que é você!<br>Eder: Finalmente te achei! Comprei um docinho 🥰", [
            { texto: "Viver felizes para sempre", acao: () => {
                txt.innerHTML = "Juntos, conseguiram escapar do jogo e voltar ao mundo real! <br><strong>FIM DE JOGO</strong>";
                opt.innerHTML = "";
            }}
        ]);
    }

    // 4. O NEYMAR (Apenas engraçado)
    function encontrarNeymar() {
        npc.src = "Neymar.PNG";
        npc.style.display = "block";
        exibirDialogo("Neymar Jr aparece do nada! <br>'E aí parça, tá procurando a Isabela? Ela foi por ali!'", [
            { texto: "Rir e continuar procurando", acao: () => alert("Continua na próxima atualização!") }
        ]);
    }

    // Função auxiliar para exibir a UI
    function exibirDialogo(texto, botoes) {
        ui.style.display = "block";
        txt.innerHTML = texto;
        opt.innerHTML = "";
        botoes.forEach(b => {
            const btn = document.createElement("button");
            btn.className = "btn-opcao";
            btn.innerHTML = b.texto;
            btn.onclick = b.acao;
            opt.appendChild(btn);
        });
    }

    window.onload = iniciarJogo;
</script>

</body>
</html>
