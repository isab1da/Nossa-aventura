<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nossa Aventura</title>
    <style>
        :root { --gb-body: #9e9e9e; --gb-accent: #9b2c5e; }
        body { background: #1a1a1a; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        
        #game-console { background: var(--gb-body); padding: 20px; border-radius: 10px 10px 60px 10px; border: 4px solid #333; }
        #game-container { position: relative; width: 320px; height: 320px; border: 15px solid #333; overflow: hidden; background: #000; }
        canvas { display: block; image-rendering: pixelated; }
        
        #dialog-ui { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: white; border: 3px solid black; padding: 10px; width: 85%; min-height: 60px; font-size: 12px; display: none; z-index: 15; box-sizing: border-box; }
        #dialog-name { font-weight: bold; color: var(--gb-accent); margin-bottom: 4px; display: block; }
        
        #instruction-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #ffd700; border: 3px solid #000; padding: 15px; width: 80%; text-align: center; display: none; z-index: 20; font-weight: bold; }

        #controls { width: 350px; height: 180px; position: relative; margin-top: 10px; }
        .d-pad { position: absolute; left: 30px; top: 40px; width: 90px; height: 90px; }
        .arrow { background: #333; border: none; width: 35px; height: 35px; position: absolute; }
        #btnLeft { left: 0; top: 25px; }
        #btnRight { right: 0; top: 25px; }
        .action-btns { position: absolute; right: 30px; top: 30px; transform: rotate(-25deg); }
        .btn-circle { width: 55px; height: 55px; border-radius: 50%; border: none; color: white; font-weight: bold; font-size: 20px; margin-left: 10px; box-shadow: 3px 3px 0px #6b1d41; }
        #btnA { background: var(--gb-accent); }
        #btnB { background: #444; }
        #start-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 30; }
    </style>
</head>
<body>

<div id="game-console">
    <div id="game-container">
        <div id="start-overlay"><button style="padding:15px; background:var(--gb-accent); color:white; border:none; border-radius:5px;" onclick="iniciarCena()">INICIAR HISTÓRIA</button></div>
        <div id="instruction-box">Você precisa achar o amor da sua vida!! Explore o ambiente por pistas.</div>
        <div id="dialog-ui"><span id="dialog-name"></span><span id="dialog-content"></span></div>
        <canvas id="gameCanvas" width="320" height="320"></canvas>
    </div>
</div>

<div id="controls">
    <div class="d-pad"><button class="arrow" id="btnLeft">◀</button><button class="arrow" id="btnRight">▶</button></div>
    <div class="action-btns"><button class="btn-circle" id="btnB">B</button><button class="btn-circle" id="btnA">A</button></div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const dialogUI = document.getElementById('dialog-ui');
    const dName = document.getElementById('dialog-name');
    const dContent = document.getElementById('dialog-content');
    const instrBox = document.getElementById('instruction-box');

    let gameState = "wait";
    let introStep = 0;
    let transitionAlpha = 0;
    let walkToggle = false;

    const imgQuarto = new Image(); imgQuarto.src = 'Quarto.PNG';
    const imgFundo = new Image(); imgFundo.src = 'Fundo_aventura.PNG';
    
    // Configurações Personagens
    let pIntro = { x: -60, y: 150, w: 80, h: 140 }; // Diminuído (4x -> ~2.5x)
    let eIntro = { x: 180, y: 150, w: 80, h: 140 };
    let player = { x: 20, y: 190, w: 35, h: 60, velY: 0, isJumping: false, visible: false };
    let partner = { x: 800, y: 190, w: 35, h: 60, visible: false }; // Isabela começa longe

    const dialogosIntro = [
        { n: "Eder", t: "Oi amor, já to quase acabando o jogo..." },
        { n: "Isabela", t: "Posso jogar com você?" },
        { n: "Eder", t: "Eu só queria finalizar essa parte sozinho..." },
        { n: "Isabela", t: "Ah, por favor! Então eu controlo o teclado e, você, o mouse 🥹" },
        { n: "Eder", t: "... acho que isso não vai dar certo, amor" },
        { n: "Isabela", t: "Vai sim! Só vou apertar esse bot-" }
    ];

    const dialogosAventura = [
        { n: "Eder", t: "O que? Onde é que eu tô? 😨 E cade a Isabela?" },
        { n: "Eder", t: "Espera, eu reconheço esse lugar... 🤨" },
        { n: "Eder", t: "Eu - eu tô dentro do meu jogo! 😟" },
        { n: "Eder", t: "Aquele botão que a Isabela apertou deve ter transportado a gente pra cá." },
        { n: "Eder", t: "Mas onde será que ela foi parar..? 🤨" }
    ];

    function iniciarCena() { document.getElementById('start-overlay').style.display='none'; gameState="walking_in"; }

    function avancarDialogo() {
        if (gameState === "dialogo_intro") {
            if (introStep < dialogosIntro.length) {
                dName.innerText = dialogosIntro[introStep].n;
                dContent.innerText = dialogosIntro[introStep].t;
                introStep++;
            } else { dialogUI.style.display='none'; abducao(); }
        } else if (gameState === "dialogo_aventura") {
            if (introStep < dialogosAventura.length) {
                dName.innerText = dialogosAventura[introStep].n;
                dContent.innerText = dialogosAventura[introStep].t;
                introStep++;
            } else { 
                dialogUI.style.display='none'; 
                instrBox.style.display='block';
                setTimeout(() => { instrBox.style.display='none'; gameState="playing"; }, 3000);
            }
        }
    }

    function abducao() {
        gameState = "transition";
        let flash = setInterval(() => {
            transitionAlpha += 0.05;
            if (transitionAlpha >= 1) {
                clearInterval(flash);
                gameState = "dialogo_aventura";
                introStep = 0;
                player.visible = true;
                transitionAlpha = 0;
                dialogUI.style.display = 'block';
                avancarDialogo();
            }
        }, 50);
    }

    document.getElementById('btnA').onclick = avancarDialogo;
    document.getElementById('btnB').onclick = () => { if(gameState === "playing" && !player.isJumping) { player.velY = -10; player.isJumping = true; } };

    let keys = { L: false, R: false };
    document.getElementById('btnLeft').ontouchstart = () => { keys.L = true; };
    document.getElementById('btnLeft').ontouchend = () => { keys.L = false; };
    document.getElementById('btnRight').ontouchstart = () => { keys.R = true; };
    document.getElementById('btnRight').ontouchend = () => { keys.R = false; };

    setInterval(() => { if(keys.L || keys.R) walkToggle = !walkToggle; }, 200);

    function draw() {
        ctx.clearRect(0, 0, 320, 320);
        if (["walking_in", "dialogo_intro", "transition"].includes(gameState)) {
            ctx.drawImage(imgQuarto, 0, 0, 320, 320);
            ctx.drawImage(new Image().src = 'Ele_frente.PNG' && eIntro.img || eIntro.img || new Image(), eIntro.x, eIntro.y, eIntro.w, eIntro.h); // Simplificado para o exemplo
            
            let imgP = new Image();
            if (gameState === "walking_in") {
                imgP.src = walkToggle ? 'Ela_andando_direita.PNG' : 'Ela_direita.PNG';
                if (pIntro.x < 80) pIntro.x += 2;
                else { gameState = "dialogo_intro"; dialogUI.style.display = 'block'; avancarDialogo(); }
            } else { imgP.src = 'Ela_frente.PNG'; }
            ctx.drawImage(imgP, pIntro.x, pIntro.y, pIntro.w, pIntro.h);
            
            if (gameState === "transition") { ctx.fillStyle = `rgba(255,255,255,${transitionAlpha})`; ctx.fillRect(0,0,320,320); }
        } else if (gameState === "dialogo_aventura" || gameState === "playing") {
            ctx.drawImage(imgFundo, 0, 0, 320, 250);
            ctx.fillStyle = "#4a3528"; ctx.fillRect(0, 250, 320, 70);
            
            let pImg = new Image();
            if (keys.L) pImg.src = walkToggle ? 'Ele_andando_esquerda.PNG' : 'Ele_esquerda.PNG';
            else if (keys.R) pImg.src = walkToggle ? 'Ele_andando_direita.PNG' : 'Ele_direita.PNG';
            else pImg.src = 'Ele_frente.PNG';
            
            if (gameState === "playing") {
                if (keys.L && player.x > 0) player.x -= 3;
                if (keys.R) player.x += 3; // Aqui ele pode andar infinitamente para a direita
                player.velY += 0.6; player.y += player.velY;
                if (player.y > 190) { player.y = 190; player.velY = 0; player.isJumping = false; }
            }
            ctx.drawImage(pImg, player.x, player.y, player.w, player.h);
        }
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
