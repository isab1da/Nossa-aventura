<!DOCTYPE html>
<html>
<head>
    <title>Nossa Aventura</title>
    <style>
        body { background: #1a1a1a; display: flex; flex-direction: column; align-items: center; margin: 0; font-family: 'Courier New', Courier, monospace; }
        #game-container { width: 360px; height: 400px; background: #87CEEB; border: 10px solid #333; position: relative; overflow: hidden; margin-top: 20px; }
        
        /* Controles simulando a foto */
        #controls { width: 360px; height: 300px; background: #2c3e50; position: relative; border-radius: 0 0 20px 20px; }
        .d-pad { position: absolute; left: 20px; top: 50px; width: 120px; height: 120px; background: #555; clip-path: polygon(33% 0%, 66% 0%, 66% 33%, 100% 33%, 100% 66%, 66% 66%, 66% 100%, 33% 100%, 33% 66%, 0% 66%, 0% 33%, 33% 33%); }
        .button-a, .button-b { position: absolute; width: 70px; height: 70px; border-radius: 50%; background: #9b2c5e; color: #521832; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 24px; }
        .button-a { right: 20px; top: 40px; }
        .button-b { right: 100px; top: 90px; }
    </style>
</head>
<body>

    <div id="game-container">
        <div style="text-align: center; margin-top: 150px;">[Cenário Pixel Art Aqui]</div>
    </div>

    <div id="controls">
        <div class="d-pad"></div>
        <div class="button-b">B</div>
        <div class="button-a">A</div>
    </div>

</body>
</html>
