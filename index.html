<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nossa Aventura</title>
    <style>
        body { background: #1a1a1a; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        #game-container { position: relative; width: 320px; height: 320px; border: 5px solid #333; overflow: hidden; background: #000; }
        canvas { display: block; image-rendering: pixelated; }
        
        /* Balão de Fala da Intro */
        #intro-dialog { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); background: white; border: 2px solid black; padding: 8px; width: 80%; font-size: 12px; display: none; z-index: 5; border-radius: 5px; text-align: center; }

        /* Camada de UI Final e Diálogos do Jogo */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; background: rgba(0,0,0,0.8); color: white; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; text-align: center; z-index: 10; }
        .choice-btn { background: white; color: black; border: none; padding: 10px; margin: 5px; width: 95%; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 14px; }
        
        #start-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 20; }
        #start-btn { padding: 15px 30px; font-size: 18px; background: #9b2c5e; color: white; border: none; border-radius: 10px; cursor: pointer; }

        #controls { width: 320px; height: 180px; background: #2c3e50; position: relative; border-radius: 0 0 20px 20px; }
        .d-pad { position: absolute; left: 20px; top: 40px; width: 100px; height: 100px; }
        .arrow { background: #444; border: none; color: white; width: 45px; height: 45px; position: absolute; font-size: 20px; }
        #btnLeft { left: 0; top: 25px; }
        #btnRight { right: 0; top: 25px; }
        .action-btns { position: absolute; right: 20px; top: 40px; }
        .btn-circle { width: 60px; height: 60px; border-radius: 50%; border: none; color: white; font-weight: bold; font-size: 20px; margin-left: 5px; }
        #btnA { background: #9b2c5e; }
        #btnB { background: #444; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="start-overlay"><button id="start-btn">INICIAR HISTÓRIA</button></div>
        <div id="intro-dialog"></div>
        <canvas id="gameCanvas" width="320" height="320"></canvas>
        <div id="ui-layer">
            <p id="dialog-text"></p>
            <div id="choices"></div>
        </div>
    </div>

    <div id="controls">
        <div class="d-pad">
            <button class="arrow" id="btnLeft">◀</button>
            <button class="arrow" id="btnRight">▶</button>
        </div>
        <div class="action-btns">
            <button class="btn-circle" id="btnB">B</button>
            <button class="btn-circle" id="btnA">A</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const uiLayer = document.getElementById('ui-layer');
    const introDialog = document.getElementById('intro-dialog');
    const startOverlay = document.getElementById('start-overlay');

    let gameState = "start_screen";
    let transitionAlpha = 0;
    let introStep = 0;

    const imgQuarto = new Image(); imgQuarto.src = 'Quarto.PNG';
    const imgFundo = new Image(); imgFundo.src = 'Fundo_aventura.PNG';
    const playerImg = new Image(); playerImg.src = 'Ele_frente.PNG';
    const partnerImg = new Image(); partnerImg.src = 'Ela_frente.PNG';

    let pIntro = { x: -50, y: 180, w: 30, h: 50 }; // Você entrando
    let eIntro = { x: 200, y: 180, w: 30, h: 50 }; // Ele no PC
    let player = { x: 20, y: 190, w: 35, h: 60, velY: 0, isJumping: false };
    let partner = { x: 270, y: 190, w: 35, h: 60 };

    const dialogos = [
        { nome: "Ele", texto: "Oi amor, já to quase acabando o jogo..." },
        { nome: "Eu", texto: "Posso jogar com você?" },
        { nome: "Ele", texto: "Eu só queria finalizar essa parte sozinho..." },
        { nome: "Eu", texto: "Ah, por favor! Então eu controlo o teclado e, você, o mouse 🥹" },
        { nome: "Ele", texto: "... acho que isso não vai dar certo, amor" },
        { nome: "Eu", texto: "Vai sim! Só vou apertar esse bot-" }
    ];

    function iniciarCena() {
        startOverlay.style.display = 'none';
        gameState = "walking_in";
    }

    function proximoDialogo() {
        if (introStep < dialogos.length) {
            introDialog.style.display = 'block';
            introDialog.innerText = `${dialogos[introStep].nome}: ${dialogos[introStep].texto}`;
            introStep++;
            setTimeout(proximoDialogo, 3000);
        } else {
            introDialog.style.display = 'none';
            abducao();
        }
    }

    function abducao() {
        gameState = "transition";
        let flash = setInterval(() => {
            transitionAlpha += 0.05;
            if (transitionAlpha >= 1) {
                clearInterval(flash);
                gameState = "playing";
                transitionAlpha = 0;
            }
        }, 50);
    }

    document.getElementById('start-btn').onclick = iniciarCena;

    function update() {
        if (gameState === "walking_in") {
            if (pIntro.x < 160) {
                pIntro.x += 2;
                partnerImg.src = 'Ela_direita.PNG';
            } else {
                partnerImg.src = 'Ela_frente.PNG';
                gameState = "dialogo_intro";
                proximoDialogo();
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, 320, 320);
        
        if (gameState === "start_screen" || gameState === "walking_in" || gameState === "dialogo_intro" || gameState === "transition") {
            ctx.drawImage(imgQuarto, 0, 0, 320, 320);
            ctx.drawImage(playerImg, eIntro.x, eIntro.y, eIntro.w, eIntro.h);
            ctx.drawImage(partnerImg, pIntro.x, pIntro.y, pIntro.w, pIntro.h);
            
            if (gameState === "transition") {
                ctx.fillStyle = `rgba(255,255,255,${transitionAlpha})`;
                ctx.fillRect(0,0,320,320);
            }
        } else if (gameState === "playing") {
            ctx.drawImage(imgFundo, 0, 0, 320, 250);
            ctx.fillStyle = "#4a3528"; ctx.fillRect(0, 250, 320, 70);
            ctx.drawImage(partnerImg, partner.x, partner.y, partner.w, partner.h);
            ctx.drawImage(playerImg, player.x, player.y, player.w, player.h);
        }
        update();
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
