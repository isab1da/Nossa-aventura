<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nossa Aventura</title>
    <style>
        :root { --gb-body: #9e9e9e; --gb-accent: #9b2c5e; }
        body { background: #1a1a1a; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        #game-console { background: var(--gb-body); padding: 20px; border-radius: 10px 10px 60px 10px; border: 4px solid #333; }
        #game-container { position: relative; width: 320px; height: 320px; border: 15px solid #333; overflow: hidden; background: #000; }
        canvas { display: block; image-rendering: pixelated; }
        #dialog-ui { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: white; border: 3px solid black; padding: 10px; width: 85%; min-height: 60px; font-size: 11px; display: none; z-index: 15; box-sizing: border-box; }
        #dialog-name { font-weight: bold; color: var(--gb-accent); margin-bottom: 4px; display: block; }
        #instruction-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #ffd700; border: 3px solid #000; padding: 15px; width: 80%; text-align: center; display: none; z-index: 20; font-weight: bold; font-size: 12px;}
        #controls { width: 350px; height: 180px; position: relative; margin-top: 10px; }
        .d-pad { position: absolute; left: 30px; top: 40px; width: 90px; height: 90px; }
        .arrow { background: #333; border: none; width: 40px; height: 40px; position: absolute; color: white; font-size: 18px; }
        #btnLeft { left: 0; top: 25px; }
        #btnRight { right: 0; top: 25px; }
        .action-btns { position: absolute; right: 30px; top: 30px; transform: rotate(-25deg); }
        .btn-circle { width: 55px; height: 55px; border-radius: 50%; border: none; color: white; font-weight: bold; font-size: 20px; margin-left: 10px; box-shadow: 3px 3px 0px #6b1d41; }
        #btnA { background: var(--gb-accent); }
        #btnB { background: #444; }
        #start-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 30; }
        .choice-btn { 
            background: #444 !important; 
            color: #fff !important;
            border: 2px solid #000 !important; 
            margin: 10px 0 !important; 
            padding: 10px !important; 
            width: 100% !important; 
            font-size: 11px !important; 
            cursor: pointer !important; 
            display: block !important; 
            text-align: center !important;
            border-radius: 5px !important;
            box-shadow: 0 4px 0 #222 !important;
            font-family: 'Courier New', Courier, monospace !important;
            text-transform: uppercase;
        }
        .choice-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #222 !important;
        }
    </style>
</head>
<body>

<div id="musica-fundo"></div>

<div id="game-console">
    <div id="game-container">
        <div id="start-overlay"><button style="padding:15px; background:var(--gb-accent); color:white; border:none; border-radius:5px; cursor:pointer;" onclick="iniciarCena()">INICIAR HISTÓRIA</button></div>
        <div id="instruction-box"></div>
        <div id="dialog-ui"><span id="dialog-name"></span><span id="dialog-content"></span></div>
        <canvas id="gameCanvas" width="320" height="320"></canvas>
    </div>
</div>

<div id="controls">
    <div class="d-pad"><button class="arrow" id="btnLeft">◀</button><button class="arrow" id="btnRight">▶</button></div>
    <div class="action-btns"><button class="btn-circle" id="btnB">B</button><button class="btn-circle" id="btnA">A</button></div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const dialogUI = document.getElementById('dialog-ui');
const dName = document.getElementById('dialog-name');
const dContent = document.getElementById('dialog-content');
const instrBox = document.getElementById('instruction-box');

let gameState = "wait";
let introStep = 0, transitionAlpha = 0, walkToggle = false, cameraX = 0;
let checkpointX = 50;

// Imagens
const imgQuarto = new Image(); imgQuarto.src = 'Quarto.PNG';
const imgFundo = new Image(); imgFundo.src = 'Fundo_aventura.PNG';
const imgEleFrente = new Image(); imgEleFrente.src = 'Ele_frente.PNG';
const imgFeia = new Image(); imgFeia.src = 'Feia.PNG';
const imgTaverna = new Image(); imgTaverna.src = 'Taverna.PNG';
const imgNeymar = new Image(); imgNeymar.src = 'Neymar.PNG';

let sprEder = new Image(); sprEder.src = 'Ele_frente.PNG';
let sprIsabela = new Image(); sprIsabela.src = 'Ela_frente.PNG';

// Posições e Objetos
let eIntro = { x: 180, y: 150, w: 80, h: 140 }; 
let pIntro = { x: -80, y: 150, w: 80, h: 140 }; 
let player = { x: 50, y: 190, w: 35, h: 60, velY: 0, isJumping: false, dead: false };
let partner = { x: 5000, y: 190, w: 35, h: 60 }; 
let feia = { x: 2800, y: 180, w: 45, h: 75 };
let taverna = { x: 3500, y: 100, w: 200, h: 150 };
let neymar = { x: 4500, y: 180, w: 50, h: 75, visivel: true };

const hazards = [
    {type: 'spike', x: 600}, {type: 'hole', x: 1000, w: 80}, {type: 'spike', x: 1600},
    {type: 'hole', x: 2100, w: 90}, {type: 'spike', x: 2500}
];

const dialogosIntro = [
    { n: "Eder", t: "Oi amor, já to quase acabando o jogo..." },
    { n: "Isabela", t: "Posso jogar com você?" },
    { n: "Eder", t: "Eu só queria finalizar essa parte sozinho..." },
    { n: "Isabela", t: "Ah, por favor! Então eu controlo o teclado e, você, o mouse 🥹" },
    { n: "Eder", t: "... acho que isso não vai dar certo, amor" },
    { n: "Isabela", t: "Vai sim! Só vou apertar esse bot-" }
];

const dialogosAventura = [
    { n: "Eder", t: "O que? Onde é que eu tô? 😨 E cade a Isabela?" },
    { n: "Eder", t: "Espera, eu reconheço esse lugar... 🤨" },
    { n: "Eder", t: "Eu - eu tô dentro do meu jogo! 😟" },
    { n: "Eder", t: "Aquele botão que a Isabela apertou deve ter transportado a gente pra cá." },
    { n: "Eder", t: "Mas onde será que ela foi parar..? 🤨" }
];

function iniciarCena() { 
    document.getElementById('start-overlay').style.display='none'; 
    gameState="walking_in"; 
    if(playerMusica) {
        playerMusica.unMute();
        playerMusica.setVolume(50);
        playerMusica.playVideo();
    }
}

function avancarDialogo() {
    if (gameState === "dialogo_intro") {
        if (introStep < dialogosIntro.length) {
            dName.innerText = dialogosIntro[introStep].n; dContent.innerText = dialogosIntro[introStep].t; introStep++;
        } else { dialogUI.style.display='none'; abducao(); }
    } else if (gameState === "dialogo_aventura") {
        if (introStep < dialogosAventura.length) {
            dName.innerText = dialogosAventura[introStep].n; dContent.innerText = dialogosAventura[introStep].t; introStep++;
        } else { 
            dialogUI.style.display='none'; instrBox.style.display='block'; instrBox.innerText = "Ache a Isabela! Explore o ambiente.";
            gameState = "instrucao_1";
        }
    } else if (gameState === "instrucao_1") {
        instrBox.innerText = "Aperte A para interagir com o cenário ou personagens.\nAperte B para pular.";
        gameState = "instrucao_2";
    } else if (gameState === "instrucao_2") {
        instrBox.style.display='none'; gameState = "playing";
    } else if (gameState === "final_jogo") {
        dialogUI.style.display='none';
        instrBox.style.display='block'; instrBox.style.background = "#ffd700";
        instrBox.innerText = "Parabéns! Você encontrou sua amada! E como todo herói merece reconhecimento, recolha seu prêmio no mundo real. 🏆";
    }
}


function abducao() {
    gameState = "transition";
    let flash = setInterval(() => {
        transitionAlpha += 0.05;
        if (transitionAlpha >= 1) {
            clearInterval(flash); gameState = "dialogo_aventura"; introStep = 0; transitionAlpha = 0;
            dialogUI.style.display = 'block'; avancarDialogo();
        }
    }, 50);
}

function resetPlayer() {
    player.dead = true;
    setTimeout(() => {
        player.x = checkpointX; player.y = 190; player.velY = 0; player.dead = false;
    }, 500);
}

// LOGICA TAVERNA ATUALIZADA
function escolherTaverna(opcao) {
    if (opcao === 'A') {
        dialogUI.style.display = 'none';
        instrBox.style.display = 'block'; instrBox.style.background = "red"; instrBox.style.color = "white";
        instrBox.innerText = "GAME OVER! Você me odeia??";
        setTimeout(() => { instrBox.style.display='none'; resetPlayer(); gameState = "playing"; }, 4000);
    } else if (opcao === 'B') {
        dialogUI.style.display = 'none'; gameState = "playing"; player.x += 100;
    } else if (opcao === 'C') {
        dialogUI.style.display = 'block'; dName.innerText = "";
        dContent.innerText = "Você realmente conhece sua amada! O cheiro do doce parece atrair Isabela até você!";
        setTimeout(() => { aparecerIsabela("C"); }, 2000);
    }
}

// LOGICA NEYMAR ATUALIZADA
function escolherNeymar(opcao) {
    if (opcao === 'X') {
        dialogUI.style.display = 'none';
        instrBox.style.display = 'block'; instrBox.style.background = "red"; instrBox.style.color = "white";
        instrBox.innerText = "GAME OVER! Jura? Espero que tenha clicado errado....";
        setTimeout(() => { instrBox.style.display='none'; resetPlayer(); gameState = "playing"; }, 4000);
    } else if (opcao === 'Y') {
        dContent.innerText = "Antes que você possa dar a bicuda, Neymar se joga no chão aos prantos. Isabela escuta o choro de longe e corre ao seu encontro.";
        neymar.visivel = false;
        setTimeout(() => { aparecerIsabela("Y"); }, 3000);
    } else if (opcao === 'Z') {
        dialogUI.style.display = 'none';
        instrBox.style.display = 'block'; instrBox.innerText = "Com foco e determinação, você segue em busca de sua amada.";
        setTimeout(() => { instrBox.style.display = 'none'; gameState = "playing"; partner.x = player.x + 400; }, 2500);
    }
}

// ATUALIZAÇÃO DO BOTÃO A PARA GERAR OS BOTÕES CORRETOS
document.getElementById('btnA').onclick = () => {
    if(gameState === "playing") {
        if(Math.abs(player.x - feia.x) < 50) {
            gameState = "game_over_ciumes"; instrBox.style.display = 'block'; instrBox.style.background = "red";
            instrBox.innerText = "GAME OVER! Por acaso essa parece a Isabela pra vc??";
            setTimeout(() => { location.reload(); }, 5000);
        } else if (Math.abs(player.x - taverna.x - 100) < 100) {
            gameState = "menu_opcoes"; dialogUI.style.display = 'block'; dName.innerText = "Taverna Nova Opção";
            dContent.innerHTML = `Você está com sede e encontra uma taverna com sinuca no caminho:<br>
                <button class="choice-btn" onclick="escolherTaverna('A')">A) Só umazinha 🍻</button>
                <button class="choice-btn" onclick="escolherTaverna('B')">B) Passo longe! 😮‍💨</button>
                <button class="choice-btn" onclick="escolherTaverna('C')">C) Comprar docinho 🍫</button>`;
        } else if (Math.abs(player.x - neymar.x) < 60 && neymar.visivel) {
            gameState = "menu_opcoes"; dialogUI.style.display = 'block'; dName.innerText = "Neymar";
            dContent.innerHTML = `Fala mano, blz? Topa me ajudar pra eu te colocar como herdeiro?<br>
                <button class="choice-btn" onclick="escolherNeymar('X')">X) Claro que ajudo!! 🐂</button>
                <button class="choice-btn" onclick="escolherNeymar('Y')">Y) Dar bicuda no traíra! 🙏</button>
                <button class="choice-btn" onclick="escolherNeymar('Z')">Z) A patroa primeiro. 🫡</button>`;
        } else if (Math.abs(player.x - partner.x) < 60 && gameState !== "final_jogo") {
             aparecerIsabela("Z");
        } else { avancarDialogo(); }
    } else { avancarDialogo(); }
};


function aparecerIsabela(tipo) {
    gameState = "encontro_final";
    partner.x = player.x + 300;
    let intervalo = setInterval(() => {
        partner.x -= 3; walkToggle = !walkToggle;
        if(partner.x <= player.x + 50) {
            clearInterval(intervalo);
            dialogUI.style.display = 'block'; dName.innerText = "Isabela";
            if(tipo === "C") {
                dContent.innerHTML = "Amor! Nem acredito que é você!<br><b>Eder:</b> Finalmente te achei! Ainda comprei um docinho 🥰<br><b>Isabela:</b> Te amo, mô! E prometo não atrapalhar mais o seu jogo! 😅";
            } else if(tipo === "Y") {
                dContent.innerHTML = "<b>Eder:</b> Amor! Nem acredito que te encontrei!<br><b>Isabela:</b> Nem eu! Ainda bem que o Neymar fez aquele escândalo 🥹<br><b>Eder:</b> Infelizmente vamos continuar pobres, mas pelo menos estamos juntos!";
            } else {
                dContent.innerHTML = "<b>Eder:</b> Amor! Nem acredito que te encontrei!<br><b>Isabela:</b> Nem eu! Agora podemos sair daqui! 🤩";
            }
            gameState = "final_jogo";
        }
    }, 50);
}

document.getElementById('btnB').onclick = () => { if(gameState === "playing" && !player.isJumping && !player.dead) { player.velY = -12; player.isJumping = true; } };

let keys = { L: false, R: false };
document.getElementById('btnLeft').ontouchstart = (e) => { e.preventDefault(); keys.L = true; };
document.getElementById('btnLeft').ontouchend = () => keys.L = false;
document.getElementById('btnRight').ontouchstart = (e) => { e.preventDefault(); keys.R = true; };
document.getElementById('btnRight').ontouchend = () => keys.R = false;

setInterval(() => { if(keys.L || keys.R || gameState === "walking_in" || gameState === "encontro_final") walkToggle = !walkToggle; }, 200);

function draw() {
    ctx.clearRect(0, 0, 320, 320);
    if (["walking_in", "dialogo_intro", "transition"].includes(gameState)) {
        ctx.drawImage(imgQuarto, 0, 0, 320, 320);
        ctx.drawImage(imgEleFrente, eIntro.x, eIntro.y, eIntro.w, eIntro.h);
        if (gameState === "walking_in") {
            sprIsabela.src = walkToggle ? 'Ela_andando_direita.PNG' : 'Ela_direita.PNG';
            if (pIntro.x < 60) pIntro.x += 2; else { gameState = "dialogo_intro"; dialogUI.style.display = 'block'; avancarDialogo(); }
        } else sprIsabela.src = 'Ela_frente.PNG';
        ctx.drawImage(sprIsabela, pIntro.x, pIntro.y, pIntro.w, pIntro.h);
        if (gameState === "transition") { ctx.fillStyle = `rgba(255,255,255,${transitionAlpha})`; ctx.fillRect(0,0,320,320); }
    } 
    else {
        cameraX = player.x - 80; if(cameraX < 0) cameraX = 0;
        ctx.drawImage(imgFundo, -(cameraX * 0.1) % 320, 0, 640, 250); 
        ctx.save(); ctx.translate(-cameraX, 0); 
        ctx.fillStyle = "#4a3528"; ctx.fillRect(cameraX, 250, 320, 70); 

        // Checkpoint
        ctx.fillStyle = "brown"; ctx.fillRect(2950, 210, 5, 40); ctx.fillRect(2930, 210, 40, 20);
        ctx.fillStyle = "white"; ctx.font = "10px Arial"; ctx.fillText("CHECK", 2935, 223);
        if(player.x > 2950) checkpointX = 2950;

        hazards.forEach(h => {
            if(h.type === 'spike') {
                ctx.fillStyle = "green"; ctx.beginPath(); ctx.moveTo(h.x, 250); ctx.lineTo(h.x+20, 220); ctx.lineTo(h.x+40, 250); ctx.fill();
                if(!player.dead && player.x+20 > h.x && player.x < h.x+20 && player.y > 170) resetPlayer();
            } else {
                ctx.fillStyle = "#000"; ctx.fillRect(h.x, 250, h.w, 70);
                if(!player.dead && player.x+15 > h.x && player.x+15 < h.x+h.w && player.y >= 190 && !player.isJumping) resetPlayer();
            }
        });

        ctx.drawImage(imgFeia, feia.x, feia.y, feia.w, feia.h);
        ctx.drawImage(imgTaverna, taverna.x, taverna.y, taverna.w, taverna.h);
        if(neymar.visivel) ctx.drawImage(imgNeymar, neymar.x, neymar.y, neymar.w, neymar.h);

        // Desenhar Isabela se for encontro final ou Opção Z
        if(gameState === "encontro_final" || (player.x > neymar.x && !neymar.visivel) || partner.x < 6000) {
            sprIsabela.src = walkToggle ? 'Ela_andando_esquerda.PNG' : 'Ela_esquerda.PNG';
            ctx.drawImage(sprIsabela, partner.x, partner.y, player.w, player.h);
        }

        if (gameState === "playing" && !player.dead) {
            if (keys.L && player.x > cameraX) player.x -= 4;
            if (keys.R) player.x += 4;
            player.velY += 0.7; player.y += player.velY;
            if (player.y > 190) { player.y = 190; player.velY = 0; player.isJumping = false; }
        }

        if (keys.L) sprEder.src = walkToggle ? 'Ele_andando_esquerda.PNG' : 'Ele_esquerda.PNG';
        else if (keys.R) sprEder.src = walkToggle ? 'Ele_andando_direita.PNG' : 'Ele_direita.PNG';
        else sprEder.src = 'Ele_frente.PNG';

        ctx.drawImage(sprEder, player.x, player.y, player.w, player.h);
        ctx.restore();
    }
    requestAnimationFrame(draw);
}
draw();

let playerMusica;
function onYouTubeIframeAPIReady() {
    playerMusica = new YT.Player('musica-fundo', {
        height: '0', width: '0', videoId: 'bZr89T3jp-Q',
        playerVars: { 'autoplay': 1, 'loop': 1, 'playlist': 'bZr89T3jp-Q', 'controls': 0 },
        events: { 'onReady': (e) => e.target.mute() } // Começa mudo para permitir o autoplay
    });
}

// Carrega a API do YouTube
let tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
let firstScriptTag = document.getElementsByTagName('script')[0];
firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

</script>
</body>
</html>
